<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#24120e"><meta name="description" content="Convite de Jaqueline Guiducci. Guia de traje anos 70, localização e confirmação de presença."><title>Edição Limitada · Jaqueline Guiducci</title><link rel="stylesheet" href="convite/styles.css"><link rel="stylesheet" href="site.css?v=10"><script src="convite/script.js" defer></script></head>
<body class="home-page effects-playing">
<header class="top wrap"><nav aria-label="Navegação"><a href="manual.html">Manual do Convidado</a><a href="local.html">Local</a><a href="presenca.html">Confirmar presença</a></nav></header><main id="inicio">
<section class="benjamim-scroll" id="benjamimScroll" aria-label="Início">
    <section class="benjamim-stage" id="stage" aria-label="Convite animado de Jaqueline Guiducci">
      <div class="fallback-bg" aria-hidden="true"></div>

      <div class="bg-stack" aria-hidden="true">
        <div class="bg-layer bg-base"></div>
        <div class="bg-layer bg-red"></div>
        <div class="bg-layer bg-cyan"></div>
      </div>

      <div class="statue-layer intro-ambient" id="statueLayer" aria-hidden="true">
        <img class="statue statue-echo" id="statueEcho5" src="assets/vinil.webp" alt="" />
        <img class="statue statue-echo" id="statueEcho4" src="assets/vinil.webp" alt="" />
        <img class="statue statue-echo" id="statueEcho3" src="assets/vinil.webp" alt="" />
        <img class="statue statue-echo" id="statueEcho2" src="assets/vinil.webp" alt="" />
        <img class="statue statue-echo" id="statueEcho1" src="assets/vinil.webp" alt="" />
        <img class="statue statue-main" id="statueMain" src="assets/vinil.webp" alt="" />
      </div>

      <div class="popup-layer intro-ambient" id="popupLayer" aria-hidden="true">
        <div class="retro-popup popup-paint popup-paint-shell" id="popupPaint">
          <img class="paint-state paint-pink" id="paintPink" src="assets/fita.webp" alt="" />
          <img class="paint-state paint-blue" id="paintBlue" src="assets/fita.webp" alt="" />
          <img class="paint-state paint-yellow" id="paintYellow" src="assets/fita.webp" alt="" />
          <img class="paint-cursor" id="paintCursor" src="assets/ano.webp" alt="" />
        </div>
        <img class="retro-popup popup-exe" id="popupExe" src="assets/titulo.webp" alt="" />
        <img class="retro-popup popup-message" id="popupMessage" src="assets/nome.webp" alt="" />
        <img class="retro-popup popup-media" id="popupMedia" src="assets/fita.webp" alt="" />
      </div>

      <!-- V8: corredor de palmeiras em profundidade, inspirado no movimento do vídeo de referência.
           Elas surgem pequenas junto às palmeiras do fundo, crescem e ABREM para as laterais.
           Novas árvores nascem atrás das anteriores. O loop inteiro congela no PLAY. -->
      <div class="palm-stream intro-ambient" id="palmStream" aria-hidden="true">
        <img class="moving-palm palm-left" data-side="left" data-phase="0.00" data-lane="0" src="assets/fita.webp" alt="" />
        <img class="moving-palm palm-right" data-side="right" data-phase="0.03" data-lane="0" src="assets/vinil.webp" alt="" />
        <img class="moving-palm palm-left" data-side="left" data-phase="0.24" data-lane="1" src="assets/vinil.webp" alt="" />
        <img class="moving-palm palm-right" data-side="right" data-phase="0.27" data-lane="1" src="assets/fita.webp" alt="" />
        <img class="moving-palm palm-left" data-side="left" data-phase="0.49" data-lane="2" src="assets/fita.webp" alt="" />
        <img class="moving-palm palm-right" data-side="right" data-phase="0.52" data-lane="2" src="assets/vinil.webp" alt="" />
        <img class="moving-palm palm-left" data-side="left" data-phase="0.74" data-lane="3" src="assets/vinil.webp" alt="" />
        <img class="moving-palm palm-right" data-side="right" data-phase="0.77" data-lane="3" src="assets/fita.webp" alt="" />
      </div>

      <div class="dolphin-layer intro-ambient" id="dolphinLayer" aria-hidden="true">
        <img class="dolphin dolphin-left" id="dolphinLeft" src="assets/vinil.webp" alt="" />
        <img class="dolphin dolphin-right" id="dolphinRight" src="assets/fita.webp" alt="" />
      </div>

      <div class="flight-actors intro-ambient" aria-hidden="true">
        <img class="ufo ufo-left" id="ufoLeft" src="assets/ano.webp" alt="" />
        <img class="ufo ufo-right" id="ufoRight" src="assets/ano.webp" alt="" />
        <img class="hummingbird" id="hummingbird" src="assets/fita.webp" alt="" />
        <div class="globe-group" id="globeGroup">
          <img class="globe globe-left" id="globeLeft" src="assets/globo.webp" alt="" />
          <img class="globe globe-right" id="globeRight" src="assets/globo.webp" alt="" />
        </div>
        <div class="flamingo-group" id="flamingoGroup">
          <img class="flamingo flamingo-echo" id="flamingoEcho3" src="assets/globo.webp" alt="" />
          <img class="flamingo flamingo-echo" id="flamingoEcho2" src="assets/globo.webp" alt="" />
          <img class="flamingo flamingo-echo" id="flamingoEcho1" src="assets/globo.webp" alt="" />
          <img class="flamingo flamingo-main" id="flamingoMain" src="assets/globo.webp" alt="" />
        </div>
      </div>

      <svg class="flight-guide" aria-hidden="true" viewBox="0 0 100 60" preserveAspectRatio="none">
        <path id="birdFlightPath" d="M -4 18
          C 1 17, 5 12, 10 11
          C 15 10, 18 14, 17 18
          C 16 22, 11 23, 7 21
          C 2 18, 5 12, 12 11
          C 18 10, 24 14, 30 22
          C 35 29, 36 37, 31 42
          C 25 47, 18 41, 19 33
          C 20 25, 30 23, 40 28
          C 49 33, 57 46, 71 45
          C 84 44, 91 34, 88 21
          C 86 14, 83 10, 80 8" />
      </svg>

      <canvas id="fxCanvas" aria-hidden="true"></canvas>

      <div class="neon-haze haze-a" aria-hidden="true"></div>
      <div class="neon-haze haze-b" aria-hidden="true"></div>
      <div class="light-sweep" aria-hidden="true"></div>
      <div class="vhs-roll" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="noise" aria-hidden="true"></div>
      <div class="screen-interference" id="screenInterference" aria-hidden="true"></div>
      <div class="glitch-bar" id="glitchBar" aria-hidden="true"></div>
      <div class="edge-vignette" aria-hidden="true"></div>

      <div class="glitch-slices" id="glitchSlices" aria-hidden="true"></div>

      <div class="title-wrap" id="titleWrap">
        <div id="titleFrame" hidden></div>
        <img class="home-name" src="assets/nome.webp" alt="Jaqueline Guiducci">
        <p class="event-date"><time datetime="2026-12-19T16:00:00-03:00">SÁBADO, 19 DE DEZEMBRO <span>·</span> 16H</time></p>
        <div class="actions">
          <button id="playButton" class="button" type="button">Manual do Convidado</button>
          <a class="button solid" href="presenca.html">Confirmar presença</a>
        </div>
      </div>
      <div class="dance-lights" aria-hidden="true"></div>
      <div class="extra-reflections" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="home-globe">
        <img class="globe-static" src="assets/globo.webp" alt="">
        <span class="globe-spin" aria-hidden="true"></span>
        <i class="glint glint-a"></i><i class="glint glint-b"></i><i class="glint glint-c"></i><i class="glint glint-d"></i><i class="glint glint-e"></i>
      <h1 class="globe-title"><img src="assets/edicao-limitada-1976.webp" alt="Edição Limitada 1976"></h1>
      </div>

      <div class="tracking" aria-hidden="true">
        <span class="tracking-label">TRACKING</span>
        <span class="tracking-bar"><i></i></span>
      </div>

      <div class="corner-code corner-code-a" aria-hidden="true">CH 02<br>PLAY MODE</div>
      <div class="corner-code corner-code-b" aria-hidden="true">REC ●<br>00:00:00</div>

      <div class="start-flash" id="startFlash" aria-hidden="true"></div>
    </section>
  </section>
</main></body></html>
